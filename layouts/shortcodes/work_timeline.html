<section class="work-timeline">
  <h1>Work Experience</h1>
  <div class="work-grid">
    {{ range site.Data.work.list }}
    <div class="work-card">
      <div class="work-logo">
        {{ if .logo }}
        <a href="{{ .url }}" target="_blank" rel="noopener">
          <img src="{{ .logo }}" alt="{{ .company }}" />
        </a>
        {{ end }}
      </div>
      <div class="work-body">
        <div class="work-head">
          <div class="work-title">{{ .company }}</div>
          <div class="work-role">{{ .role }}</div>
          <div class="work-date">{{ .date }}</div>
        </div>
        <div class="work-desc">{{ .summary }}</div>
      </div>
    </div>
    {{ end }}
  </div>

  <!-- CV Button -->
  <div class="work-cta-wrap">
    <a class="hero-cta" href="/files/CV.pdf" target="_blank" rel="noopener">View My CV →</a>
  </div>
</section>
