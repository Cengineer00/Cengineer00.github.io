<section class="projects-gallery">
  <h1>Projects</h1>
  <p class="projects-sub">Check out some of my personal and client projects</p>
  <div class="projects-grid">
    {{ range site.Data.projects.list }}
    <a class="project-tile" href="{{ .url }}" target="_blank" rel="noopener">
      <div class="project-thumb" style="background-image:url('{{ .image }}');">
        <div class="project-overlay">
          <div class="project-info">
            <div class="project-name">{{ .name }}</div>
            {{ if .tag }}<div class="project-tag">{{ .tag }}</div>{{ end }}
          </div>
        </div>
      </div>
    </a>    
    {{ end }}
  </div>
</section>
