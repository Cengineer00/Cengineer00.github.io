<section class="social-gallery">
  <h1>Social Media</h1>
  <p class="social-sub">Check out some of my YouTube and Instagram content</p>

  <div class="social-grid">
    {{ range site.Data.socials.list }}
    <a class="social-tile {{ .platform }}" href="{{ .url }}" {{ if .external }}target="_blank" rel="noopener"{{ end }}>
      <div class="social-thumb" style="background-image:url('{{ .image }}');"></div>
      <div class="social-meta">
        <div class="social-title">{{ .title }}</div>
        {{ if .platform }}<div class="social-platform">{{ .platform | title }}</div>{{ end }}
      </div>
    </a>
    {{ end }}
  </div>

  <div class="social-buttons">
    <a class="social-btn youtube" href="https://youtube.com/yourchannel" target="_blank" rel="noopener">
      <img src="images/icons/youtube.svg" alt="YouTube Logo" class="social-logo"> YouTube
    </a>
    <a class="social-btn instagram" href="https://instagram.com/yourprofile" target="_blank" rel="noopener">
      <img src="images/icons/instagram.svg" alt="Instagram Logo" class="social-logo"> Instagram
    </a>
  </div>
</section>
